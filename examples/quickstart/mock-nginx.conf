# Deterministic local fixture, not an AI model. No outbound requests.
server {
    listen 8080;
    server_name _;
    access_log off;
    location = /healthz { return 200 'ok'; }
    location = /v1/chat/completions {
        default_type application/json;
        if ($request_method != POST) { return 405; }
        # A successful response proves server-side credential injection.
        if ($http_authorization != 'Bearer local-demo-upstream-key') { return 401; }
        if ($http_x_corp_proxy_key != '') { return 400; }
        if ($http_cookie != '') { return 400; }
        return 200 '{"id":"mock-completion","object":"chat.completion","created":0,"model":"demo-chat","choices":[{"index":0,"message":{"role":"assistant","content":"Hello from the local PiProxy demo."},"finish_reason":"stop"}],"usage":{"prompt_tokens":8,"completion_tokens":9,"total_tokens":17}}';
    }
    location / { return 404; }
}
