run:
  timeout: 5m
  modules-download-timeout: 5m
  tests: true

linters:
  enable:
    - gofmt
    - govet
    - errcheck
    - staticcheck
    - gosimple
    - ineffassign
    - unused
    - misspell
    - goimports
    - revive
    - unconvert
    - gosec
    - prealloc
  disable:
    - godox

linters-settings:
  gofmt:
    simplify: true
  goimports:
    local-prefixes: github.com/earlgrey/piproxy
  revive:
    rules:
      - name: exported
        severity: warning
  gosec:
    excludes:
      - G115
      - G404

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - gosec
