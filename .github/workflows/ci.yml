name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: python3 scripts/check-staged.py
      - run: python3 -m unittest discover -s scripts -p test_release_checks.py
      - run: make test-go build
      - name: Lint (includes gosec)
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
          make lint-go
      - run: docker build -t piproxy:ci .
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.23.0
      - run: pnpm --dir ui install --frozen-lockfile
      - run: pnpm --dir webui install --frozen-lockfile
      - run: pnpm --dir ui test && pnpm --dir ui build
      - run: make test-extension test-terminal-browser webui-test webui-build lint-extension
  quickstart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: ./examples/quickstart/build.sh
      - run: docker compose -p piproxy-ci -f examples/quickstart/compose.yml up -d --wait
      - run: python3 examples/quickstart/smoke-test.py
      - if: always()
        run: docker compose -p piproxy-ci -f examples/quickstart/compose.yml down --volumes
  session-query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -t piproxy-session-query:ci services/session-query
      - name: Test isolated reader
        run: |
          docker run --rm --read-only --memory=1g --cpus=1 --pids-limit=64 \
            --cap-drop=ALL --security-opt=no-new-privileges:true \
            --tmpfs /tmp:size=64m,mode=1777 -v /var/lib/session-query \
            -e TMPDIR=/var/lib/session-query \
            --mount type=bind,src="${{ github.workspace }}/services/session-query/tests",dst=/app/tests,readonly \
            piproxy-session-query:ci python -m unittest discover -s tests -v
