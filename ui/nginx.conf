server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Don't cache the entry HTML so deploys take effect immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Reverse-proxy API calls to the admin service. The UI calls "/api/..."
    # and expects "/api" stripped (matching the Vite dev proxy). Using a
    # variable + resolver so a recreated admin container is picked up via
    # Docker's embedded DNS rather than a stale cached IP.
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $admin_host admin;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$admin_host:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
