# Example configuration file for the Pi Proxy.
# All values can be overridden via environment variables with the PROXY_ prefix.

server:
  public_addr: ":8080"
  admin_addr: ":8081"
  metrics_addr: ":9090"
  max_body_bytes: 20971520
  request_timeout: "10m"
  read_timeout: "30s"
  write_timeout: "5m"
  idle_timeout: "120s"
  shutdown_timeout: "30s"

auth:
  key_prefix: "cpk_live_"
  hash_pepper_secret_ref: "secret/proxy/key-hash-pepper"

postgres:
  dsn: "postgres://proxy:proxy@localhost:5432/proxy?sslmode=disable"
  max_open_conns: 25
  max_idle_conns: 10

redis:
  address: "localhost:6379"
  password: ""
  db: 0
  tls: false

secrets:
  provider: "env"
  address: ""
  token: ""
  namespace: ""
  env_prefix: "PROXY_SECRET_"
  # Default provider credentials are read from:
  # PROXY_SECRET_PROVIDERS_DEEPSEEK_API_KEY
  # Values may be raw API keys or JSON: {"api_key":"sk-..."}

metrics:
  enabled: true

logging:
  level: "info"
  format: "json"
  log_bodies: false

quota:
  reservation_ttl: "15m"

capture:
  enabled: true
  backend: "postgres"
  retention_days: 30
  # Canonical Pi JSONL uploads have an independent raw-session TTL.
  session_log_retention_days: 30
  queue_size: 1000
  max_payload_bytes: 10485760
  strict: false

providers:
  refresh_interval: "30s"
  balance_refresh_interval: "5m"
  balance_request_timeout: "10s"
