server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The console API lives on the proxy's shared data-plane listener, not the admin
    # port. Serving both under one hostname is what keeps the session cookie
    # same-origin — SameSite=Lax would not survive a cross-origin split, and
    # the CSRF check assumes the app and the API share an origin.
    #
    # This location deliberately declares no add_header of its own: the proxy
    # already sets its own security headers on /web/v1 responses, and nginx's
    # inheritance rules would stack anything declared here on top of them.
    #
    # Tailnet clients can reach this listener directly. Overwrite forwarding
    # headers so they cannot spoof the IP used for rate limits and audit.
    # If a private HTTPS proxy is added, configure nginx real_ip trust for
    # that specific peer first; never trust arbitrary X-Real-IP input.
    location /web/ {
        resolver 127.0.0.11 valid=30s;
        set $proxy_host proxy;
        proxy_pass http://$proxy_host:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A chat turn is a long-lived SSE stream: buffering it would hold every
        # token until the reply finished and make the console look frozen.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        chunked_transfer_encoding on;
    }

    # Security headers for the SPA itself (private does not imply trusted).
    # The bundle ships no inline script or style, so script-src and style-src
    # stay strict; Google Fonts are the only third-party document origins, and
    # storage.googleapis.com is the only extra connect-src because attachment
    # uploads PUT directly to signed GCS URLs. (Attachment downloads are
    # top-level <a> navigations, which CSP does not govern.)
    #
    # Defined in a variable so the two static locations below share one copy:
    # nginx drops server-level add_header inheritance in any location that
    # declares its own add_header (the index.html block needs one for
    # Cache-Control), and repeating the policy invites drift.
    set $csp "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://storage.googleapis.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

    # Static assets are content-hashed and cache forever.
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy $csp always;
        # Ignored over plain HTTP; honoured once the edge serves this over TLS.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri $uri/ /index.html;
    }

    # Don't cache the entry HTML so deploys take effect immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy $csp always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}
